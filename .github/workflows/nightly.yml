name: Nightly Compatibility

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Match checkout-ios-package XCFramework toolchain (built with Xcode 26.5 / Swift 6.3.2).
env:
  XCODE_VERSION: '26.5'

jobs:
  build-spm:
    name: Nightly SPM Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Xcode ${XCODE_VERSION} not found at ${XCODE_APP}"
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ExampleSPM
        run: xcodegen generate

      - name: Resolve latest SDK
        working-directory: ExampleSPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MerchantExampleSPM.xcodeproj \
            -scheme MerchantExampleSPM

      - name: Build
        working-directory: ExampleSPM
        run: |
          xcodebuild build \
            -project MerchantExampleSPM.xcodeproj \
            -scheme MerchantExampleSPM \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  build-cocoapods:
    name: Nightly CocoaPods Build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -euo pipefail
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::Xcode ${XCODE_VERSION} not found at ${XCODE_APP}"
            ls /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ExampleCocoaPods
        run: xcodegen generate

      - name: Install pods
        working-directory: ExampleCocoaPods
        run: pod install

      - name: Build
        working-directory: ExampleCocoaPods
        run: |
          xcodebuild build \
            -workspace MerchantExamplePods.xcworkspace \
            -scheme MerchantExamplePods \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  report:
    name: Report Status
    needs: [build-spm, build-cocoapods]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Nightly build failure ($(date -u +%Y-%m-%d))" \
            --body "## Nightly Build Failure

          **Date:** $(date -u +%Y-%m-%d)
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          One or more example app variants failed to build. This may indicate:
          - A breaking change in the latest SDK release
          - An Xcode toolchain update
          - A dependency issue

          Please investigate the workflow logs." \
            --label "ci-failure"
