name: Nightly Compatibility

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build-spm:
    name: Nightly SPM Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ExampleSPM
        run: xcodegen generate

      - name: Resolve latest SDK
        working-directory: ExampleSPM
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MerchantExampleSPM.xcodeproj \
            -scheme MerchantExampleSPM

      - name: Build
        working-directory: ExampleSPM
        run: |
          xcodebuild build \
            -project MerchantExampleSPM.xcodeproj \
            -scheme MerchantExampleSPM \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO

  build-cocoapods:
    name: Nightly CocoaPods Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ExampleCocoaPods
        run: xcodegen generate

      - name: Install pods
        working-directory: ExampleCocoaPods
        run: pod install

      - name: Build
        working-directory: ExampleCocoaPods
        run: |
          xcodebuild build \
            -workspace MerchantExamplePods.xcworkspace \
            -scheme MerchantExamplePods \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO

  report:
    name: Report Status
    needs: [build-spm, build-cocoapods]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Nightly build failure ($(date -u +%Y-%m-%d))" \
            --body "## Nightly Build Failure

          **Date:** $(date -u +%Y-%m-%d)
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          One or more example app variants failed to build. This may indicate:
          - A breaking change in the latest SDK release
          - An Xcode toolchain update
          - A dependency issue

          Please investigate the workflow logs." \
            --label "ci-failure"
